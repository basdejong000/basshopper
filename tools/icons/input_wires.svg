<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Incoming wire: solid, then fading out (hidden) -->
  <path d="M1.5 10 H5" fill="none" stroke="#1F6FEB" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M1.5 22 H5" fill="none" stroke="#1F6FEB" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="1.6 2.4"/>
  <!-- Grasshopper component capsule with two input grips -->
  <rect x="9" y="5" width="20" height="22" rx="5" fill="#E6E6E6" stroke="#2B2B2B" stroke-width="1.8"/>
  <circle cx="9" cy="10" r="2.5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/>
  <circle cx="9" cy="22" r="2.5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/>
  <!-- Eye with a slash: hide / show -->
  <path d="M13 16 Q19 9.5 25 16 Q19 22.5 13 16 Z" fill="none" stroke="#1F6FEB" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="19" cy="16" r="1.8" fill="#1F6FEB"/>
  <path d="M14 21 L24 11" fill="none" stroke="#2B2B2B" stroke-width="1.8" stroke-linecap="round"/>
</svg>
